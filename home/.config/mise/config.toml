[settings]
experimental = true
# Honor .nvmrc / .node-version / .python-version / .ruby-version files in projects
idiomatic_version_file_enable_tools = ["node", "python", "ruby"]

[tools]
node = "24"
python = "3.14"
ruby = "4.0"      # gems from ~/.default-gems are installed with each new version
java = "zulu-17"  # also sets JAVA_HOME

# Global npm CLIs (independent of the active node version)
"npm:eas-cli" = "latest"
"npm:vercel" = "latest"
"npm:yarn" = "latest"
"npm:ask-cli" = "latest"
